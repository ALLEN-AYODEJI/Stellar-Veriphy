openapi: 3.0.3
info:
  title: StellarVeriphy API
  version: 1.0.0
  description: |
    HTTP API for the StellarVeriphy content verification and provenance platform.
    This documents the Next.js API routes under `frontend/app/api`. For the
    on-chain Soroban contract functions (oracle, provenance, registry), see
    `docs/api/CONTRACTS.md`.
  license:
    name: MIT
servers:
  - url: /api
    description: Same-origin relative path (works in any deployment environment)
tags:
  - name: Health
    description: Service health checks
  - name: Verification
    description: Submit a content manifest for verification
  - name: Security
    description: Browser-reported security events

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Service health check
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: stellarveriphy

  /verification:
    post:
      operationId: submitVerification
      tags: [Verification]
      summary: Submit a verification request
      description: >
        Validates and rate-limits an incoming verification request. Rate
        limiting is keyed by `address` (falling back to the
        `x-wallet-address` header, then `x-forwarded-for`, then
        `"anonymous"`) with an exponential backoff on repeated violations.
        Every response carries `X-RateLimit-*` headers; a 429 additionally
        carries `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationRequestPayload"
            example:
              address: "GABCD1234EXAMPLE5678STELLARPUBLICKEY0000000000000000000"
              contentHash: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
              fileName: "artwork.png"
              fileType: "image/png"
              fileSizeBytes: 204800
              manifest:
                contentHash: "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
                creator: "GABCD1234EXAMPLE5678STELLARPUBLICKEY0000000000000000000"
                timestamp: "2026-07-29T12:00:00Z"
      responses:
        "202":
          description: The request passed validation and was accepted for processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitVerificationResponse"
              example:
                success: true
                data:
                  accepted: true
                  message: "Verification request accepted for processing."
                  request:
                    address: "GABCD1234EXAMPLE5678STELLARPUBLICKEY0000000000000000000"
                    contentHash: "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"
                    fileName: "artwork.png"
                    fileType: "image/png"
                    fileSizeBytes: 204800
                    manifest: {}
        "400":
          description: Malformed JSON, or the payload failed validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                malformedJson:
                  value: { success: false, error: "Malformed JSON payload." }
                validationFailed:
                  value:
                    success: false
                    error: "Request validation failed."
                    details:
                      - "address must be a valid Stellar public key."
                      - "contentHash must be a valid SHA-256 hex string."
        "429":
          description: Rate limit exceeded for this address.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until the caller may retry.
            X-RateLimit-Limit: { schema: { type: integer } }
            X-RateLimit-Remaining: { schema: { type: integer } }
            X-RateLimit-Reset: { schema: { type: integer }, description: Unix seconds when the window resets. }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"
              example:
                success: false
                error: "Rate limit exceeded. Please retry after the backoff period."
                retryAfterSeconds: 5

  /csp-report:
    post:
      operationId: reportCsp
      tags: [Security]
      summary: Receive a browser Content-Security-Policy violation report
      description: >
        Endpoint configured as the CSP `report-uri`/`report-to` target;
        browsers POST a violation report here automatically. Not intended to
        be called directly by API consumers.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Browser-generated CSP report (shape varies by browser).
      responses:
        "200":
          description: Report accepted (logged server-side).
          content:
            application/json:
              schema:
                type: object
                properties: { received: { type: boolean, enum: [true] } }
        "400":
          description: The report body could not be parsed.
          content:
            application/json:
              schema:
                type: object
                properties: { received: { type: boolean, enum: [false] } }

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string

    VerificationRequestPayload:
      type: object
      required: [address, contentHash, fileName, fileType, fileSizeBytes, manifest]
      properties:
        address:
          type: string
          description: Stellar public key (G...) of the submitter.
        contentHash:
          type: string
          description: SHA-256 hex digest of the media file.
        fileName:
          type: string
          maxLength: 128
        fileType:
          type: string
          description: MIME type; must be in the configured allow-list.
        fileSizeBytes:
          type: integer
          minimum: 1
        manifest:
          type: object
          description: A ContentManifest; validated and sanitized server-side.

    SubmitVerificationResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          properties:
            accepted: { type: boolean, enum: [true] }
            message: { type: string }
            request:
              $ref: "#/components/schemas/VerificationRequestPayload"

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
        details:
          type: array
          items: { type: string }
          description: Present when validation fails; one message per failed rule.

    RateLimitErrorResponse:
      type: object
      required: [success, error, retryAfterSeconds]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: string
        retryAfterSeconds:
          type: integer
