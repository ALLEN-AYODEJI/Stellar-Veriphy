global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "stellar-veriphy-staging"
    environment: "staging"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Frontend application metrics
  - job_name: "frontend"
    static_configs:
      - targets: ["frontend:3000"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # API metrics
  - job_name: "api"
    static_configs:
      - targets: ["api:3001"]
    metrics_path: "/metrics"
    scrape_interval: 10s

  # PostgreSQL exporter (if enabled)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  # Redis exporter (if enabled)
  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  # Docker stats
  - job_name: "docker"
    static_configs:
      - targets: ["unix:///var/run/docker.sock"]
    metrics_path: "/metrics"
