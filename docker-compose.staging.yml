version: "3.9"

services:
  # Staging Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: stellar-veriphy-staging-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: staging
      PORT: 3000
      NEXT_PUBLIC_STELLAR_NETWORK: testnet
      NEXT_PUBLIC_WALLET_NETWORK: testnet
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_MOCK_WALLET: "false"
      LOG_LEVEL: info
    depends_on:
      - postgres
    networks:
      - staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Staging Database
  postgres:
    image: postgres:15-alpine
    container_name: stellar-veriphy-staging-db
    environment:
      POSTGRES_DB: stellar_veriphy_staging
      POSTGRES_USER: staging_user
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-staging_password_change_me}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-staging-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging_user -d stellar_veriphy_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Staging Redis Cache (for session management)
  redis:
    image: redis:7-alpine
    container_name: stellar-veriphy-staging-cache
    environment:
      REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:-staging_redis_password}
    command: redis-server --requirepass ${STAGING_REDIS_PASSWORD:-staging_redis_password}
    volumes:
      - staging_redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Staging API Service (if applicable)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: stellar-veriphy-staging-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: staging
      PORT: 3001
      DATABASE_URL: postgresql://staging_user:${STAGING_DB_PASSWORD:-staging_password_change_me}@postgres:5432/stellar_veriphy_staging
      REDIS_URL: redis://:${STAGING_REDIS_PASSWORD:-staging_redis_password}@redis:6379
      STELLAR_NETWORK: testnet
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Monitoring - Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: stellar-veriphy-staging-prometheus
    volumes:
      - ./monitoring/prometheus-staging.yml:/etc/prometheus/prometheus.yml:ro
      - staging_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - staging-network
    restart: unless-stopped

volumes:
  staging_postgres_data:
    driver: local
  staging_redis_data:
    driver: local
  staging_prometheus_data:
    driver: local

networks:
  staging-network:
    driver: bridge
